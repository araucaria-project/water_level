<svg width="100%" viewBox="0 0 680 330" role="img" style="" xmlns="http://www.w3.org/2000/svg"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">LED color scale and diagnostics</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Water volume maps to LED color from red at low levels to blue at high levels, between 3.75 and 15 cubic metres. A second strip breathes blue when readings are healthy and red on sensor error.</desc>
<defs>
<linearGradient id="hue" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#FF3B30"/>
<stop offset="25%" stop-color="#FFD60A"/>
<stop offset="50%" stop-color="#34C759"/>
<stop offset="75%" stop-color="#32ADE6"/>
<stop offset="100%" stop-color="#007AFF"/>
</linearGradient>
</defs>

